stages:
  - build
  - deploy

build:
  stage: build
  image: docker:24
  services:
    - name: docker:24-dind
  before_script:
    - echo "$HAWK_REGISTRY_PASSWORD" | docker login -u "$HAWK_REGISTRY_USER" --password-stdin "$HAWK_REGISTRY"
    - docker context create context
    - docker buildx create --name mybuilder --driver docker-container --use context
  script:
    - TAGS="$HAWK_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - if [ -n "$CI_COMMIT_TAG" ]; then TAGS="$TAGS -t $HAWK_REGISTRY_IMAGE:$CI_COMMIT_TAG"; fi
    - docker buildx build --platform linux/amd64,linux/arm64 -f ./Dockerfile ./ -t $TAGS --push
    - echo "TAGS=${TAGS}" > tags.env
  rules:
    - if: "$CI_COMMIT_TAG"
      when: always
    - when: manual

  artifacts:
    reports:
      dotenv: tags.env  

deploy:
  stage: deploy
  image: bitnami/kubectl:1.30.7
  script:
    - echo "Deploy with tag $IMAGE_TAG"
    - envsubst < k8s/deployment.yaml | kubectl apply -f -
    - kubectl apply -k k8s/
    - kubectl apply -f k8s/service.yaml
    - kubectl apply -f k8s/ingress.yaml

  rules:
    - when: manual